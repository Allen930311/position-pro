<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Pro - 倉位計算機</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div class="container">
        <!-- Decorative background shapes -->
        <div class="bg-shape" style="width: 400px; height: 400px; background: #6366f1; top: -10%; left: -10%;"></div>
        <div class="bg-shape" style="width: 300px; height: 300px; background: #ec4899; bottom: -5%; right: 10%; opacity: 0.2;"></div>
        <div class="bg-shape" style="width: 250px; height: 250px; background: #8b5cf6; top: 40%; right: -5%; opacity: 0.3;"></div>

        <header>
            <h1>Position Pro</h1>
            <p class="subtitle">精準交易倉位計算</p>
        </header>

        <main id="app">
            <div class="glass-card">
                <div class="header-row">
                    <div class="icon-container">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="16" y2="18"/></svg>
                    </div>
                    <h2>倉位計算器</h2>
                </div>

                <div class="input-group">
                    <label class="label">固定止損金額 (USDT)</label>
                    <input type="number" id="riskAmount" class="glass-input" placeholder="例如: 20">
                </div>

                <div class="grid-2">
                    <div class="input-group">
                        <label class="label">入場價格</label>
                        <input type="number" id="entryPrice" class="glass-input" placeholder="0.0000">
                    </div>
                    <div class="input-group">
                        <label class="label">止損價格</label>
                        <input type="number" id="stopLossPrice" class="glass-input" placeholder="0.0000">
                    </div>
                </div>

                <div id="resultBox" class="result-box hidden">
                    <div id="badge" class="badge"></div>
                    <span class="label" style="text-align: center;">建議開倉數量 (Position Size)</span>
                    <span id="positionSize" class="result-value">0.0000</span>
                    <div id="distanceBox" class="distance-info">價格距離: 0</div>
                </div>

                <div id="errorMessage" class="error-message hidden">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span id="errorText"></span>
                </div>

                <div class="footer-note">
                    <p>💡 提示：本工具使用環境自適應儲存 (Storage Adapter)，自動同步您的止損設定。入場價 > 止損價為做多，反之為做空。</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="bignumber.js"></script>
    <script src="storage.js"></script>
    <script src="calculator.js"></script>
    
    <!-- PWA Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Error', err));
            });
        }
    </script>
</body>
</html>
